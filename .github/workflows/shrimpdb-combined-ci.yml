name: shrimpdb-combined-ci

on:
  push:
    branches: [paper/shrimpdb-combined-asl-ldam-simam-dcfr]
  pull_request:
    branches: [paper/shrimpdb-combined-asl-ldam-simam-dcfr]

jobs:
  closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Sync dependencies
        working-directory: studies/shrimpdb_combined_multisource
        run: uv sync --frozen
      - name: Check environment
        working-directory: studies/shrimpdb_combined_multisource
        run: uv run python scripts/00_check_environment.py --config configs/study.yaml
      - name: Validate YAML/JSON
        working-directory: studies/shrimpdb_combined_multisource
        run: |
          uv run python -c "import yaml, json, pathlib;           [yaml.safe_load(pathlib.Path(p).read_text()) for p in pathlib.Path('configs').rglob('*.yaml')];           [json.loads(pathlib.Path(p).read_text()) for p in pathlib.Path('artifacts/metadata').rglob('*.json')];           [json.loads(pathlib.Path(p).read_text()) for p in pathlib.Path('model_registry').rglob('*.json')]"
      - name: Pytest
        working-directory: studies/shrimpdb_combined_multisource
        run: uv run pytest -q
      - name: Source snapshot comparison
        working-directory: studies/shrimpdb_combined_multisource
        run: uv run python tools/compare_source_snapshot.py --snapshot-root artifacts/source_snapshot
      - name: Artifact tree validation
        working-directory: studies/shrimpdb_combined_multisource
        run: uv run python tools/validate_artifact_tree.py
      - name: Checksum verification
        working-directory: studies/shrimpdb_combined_multisource
        run: uv run python tools/verify_checksums.py
      - name: Closure audit (status only)
        working-directory: studies/shrimpdb_combined_multisource
        run: uv run python tools/run_closure_audit.py
      - name: Diff whitespace check
        run: git diff --check
