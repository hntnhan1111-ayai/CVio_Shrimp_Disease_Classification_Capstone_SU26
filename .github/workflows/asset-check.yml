name: Documentation assets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python scripts/docs/check_assets.py
