name: Documentation improvement
description: Report unclear, missing, inaccurate, or inaccessible documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Document location
      placeholder: Path, heading, or URL
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is unclear, inaccurate, missing, or inaccessible.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Proposed correction and evidence
      description: Cite repository evidence or an authoritative source where applicable.
    validations:
      required: true
