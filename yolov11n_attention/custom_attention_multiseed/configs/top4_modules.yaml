dataset:
  # Kaggle default used by the leakage-safe baseline notebooks.
  # Override with --base-data-dir if your prepared split is elsewhere.
  base_path: /kaggle/working/shrimpDisHandSegV2-1
  data_yaml: /kaggle/working/shrimpDisHandSegV2-1/data.yaml

training:
  pretrained_weights: yolo11n-seg.pt
  load_pretrained_weights: true
  output_root: runs/custom_attention_multiseed
  dataset_snapshot_root: custom_attention_multiseed/results/datasets
  train_results_csv: custom_attention_multiseed/results/top4_multiseed_train_runs.csv
  imgsz: 640
  epochs: 100
  batch: 16
  patience: 30
  task: segment
  plots: true
  verbose: true
  clean_light_aug_train_args:
    auto_augment:
    erasing: 0.0
    mosaic: 0.0
    mixup: 0.0
    cutmix: 0.0
    copy_paste: 0.0
    fliplr: 0.5
    flipud: 0.0
    hsv_h: 0.01
    hsv_s: 0.35
    hsv_v: 0.20
    degrees: 0.0
    translate: 0.05
    scale: 0.20
    shear: 0.0
    perspective: 0.0
    multi_scale: 0.0
    bgr: 0.0

evaluation:
  threshold_sweep_csv: custom_attention_multiseed/results/top4_threshold_sweep.csv
  threshold_sweep_errors_csv: custom_attention_multiseed/results/top4_threshold_sweep_errors.csv
  eval_dataset_root: custom_attention_multiseed/results/eval_datasets
  summary_csv: custom_attention_multiseed/results/top4_multiseed_summary.csv
  final_ranking_md: custom_attention_multiseed/results/top4_final_ranking.md
  default_conf: 0.25
  default_iou: 0.70
  conf_list:
    - 0.10
    - 0.15
    - 0.20
    - 0.25
    - 0.30
    - 0.35
    - 0.40
    - 0.50
  iou_list:
    - 0.50
    - 0.60
    - 0.70

healthy_aware_score:
  count_penalty_weight: 0.05
  disease_miss_penalty_weight: 0.15
  healthy_fp_penalty_weight: 0.10

modules:
  - key: triplet_attention_segment_head
    display_name: Triplet Attention Segment Head
    folder: custom_attention/triplet_attention_segment_head
    model_yaml: custom_attention/triplet_attention_segment_head/yolov11n_triplet_segment.yaml
    source_notebook: custom_attention/triplet_attention_segment_head/triplet_attention_segment_head.ipynb
    result_notebook: custom_attention/res/triplet-attention-segment-head.ipynb
    multiseed_folder: custom_attention_multiseed/triplet_attention_segment_head
    multiseed_notebook: custom_attention_multiseed/triplet_attention_segment_head/triplet_attention_segment_head_multiseed.ipynb
    register_group: legacy_common
  - key: cesa_lite_segment_head
    display_name: CESA-Lite Segment Head
    folder: custom_attention/cesa_lite_segment_head
    model_yaml: custom_attention/cesa_lite_segment_head/yolov11n_cesa_lite.yaml
    source_notebook: custom_attention/cesa_lite_segment_head/cesa_lite_segment_head.ipynb
    result_notebook: custom_attention/res/cesa-lite-segment-head.ipynb
    multiseed_folder: custom_attention_multiseed/cesa_lite_segment_head
    multiseed_notebook: custom_attention_multiseed/cesa_lite_segment_head/cesa_lite_segment_head_multiseed.ipynb
    register_group: legacy_common
  - key: context_suppression_gate_lite
    display_name: Context-Suppression Gate Lite
    folder: custom_attention/context_suppression_gate_lite
    model_yaml: custom_attention/context_suppression_gate_lite/model.yaml
    source_notebook: custom_attention/context_suppression_gate_lite/context_suppression_gate_lite.ipynb
    result_notebook: custom_attention/res/context-suppression-gate-lite.ipynb
    multiseed_folder: custom_attention_multiseed/context_suppression_gate_lite
    multiseed_notebook: custom_attention_multiseed/context_suppression_gate_lite/context_suppression_gate_lite_multiseed.ipynb
    register_group: shared_priority
  - key: sge_eca_head_gate
    display_name: SGE-ECA Head Gate
    folder: custom_attention/sge_eca_head_gate
    model_yaml: custom_attention/sge_eca_head_gate/model.yaml
    source_notebook: custom_attention/sge_eca_head_gate/sge_eca_head_gate.ipynb
    result_notebook: custom_attention/res/sge-eca-head-gate.ipynb
    multiseed_folder: custom_attention_multiseed/sge_eca_head_gate
    multiseed_notebook: custom_attention_multiseed/sge_eca_head_gate/sge_eca_head_gate_multiseed.ipynb
    register_group: shared_priority
