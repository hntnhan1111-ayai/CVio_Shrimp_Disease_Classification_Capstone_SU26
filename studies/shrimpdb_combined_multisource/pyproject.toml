[project]
name = "cvio-shrimpdb-combined"
version = "0.1.0"
description = "Seed-42 ASL-LDAM + SimAM-DCFR shrimp disease classification study on ShrimpDB and ShrimpDiseaseDB."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "ultralytics>=8.4.75",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "scikit-learn>=1.6.1",
    "pandas>=2.3.3",
    "matplotlib>=3.10.0",
    "Pillow>=11.3.0",
    "PyYAML>=6.0.3",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
